add_newline = false
format = "$directory$git_branch$git_state$git_status$nodejs$cmd_duration$line_break$character"

[directory]
truncation_length = 4
truncate_to_repo = false
truncation_symbol = "…/"
style = "bold #00F5FF"
before_repo_root_style = "#497BFF"
repo_root_style = "bold #FF00D4"
read_only_style = "#FF285B"
repo_root_format = "[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = " "
style = "bold #39FF88"

[git_state]
style = "bold #FFE600"

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "#FFE600"
conflicted = '[conflictos:${count}](bold #FF285B) '
ahead = '↑${count} '
behind = '↓${count} '
diverged = '↑${ahead_count} ↓${behind_count} '
modified = '~${count} '
staged = '+${count} '
untracked = '?${count} '

[nodejs]
symbol = "node "

[character]
success_symbol = "[❯](bold #FF00D4)"
error_symbol = "[❯](bold #FF285B)"
vimcmd_symbol = "[❮](bold #00F5FF)"
